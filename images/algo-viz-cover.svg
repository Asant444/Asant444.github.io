<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d13"/>
      <stop offset="100%" stop-color="#10141c"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#FFB86B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFB86B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1f2530" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)" opacity="0.5"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="800" height="42" fill="#10141c"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1f2530" stroke-width="1"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="21" r="6" fill="#27c93f"/>
  <text x="400" y="26" font-family="JetBrains Mono, monospace" font-size="13" fill="#7c8699" text-anchor="middle">algorithm-visualizer</text>

  <!-- icon badge -->
  <g transform="translate(80,150)">
    <rect x="-20" y="-20" width="120" height="120" rx="20" fill="#10141c" stroke="#1f2530" stroke-width="1.5"/>
    <g transform="translate(6,6) scale(1.4)" fill="none" stroke="#FFB86B" stroke-width="2.4">
      <line x1="4" y1="44" x2="44" y2="44" stroke-width="4" stroke-linecap="round"/><line x1="4" y1="44" x2="4" y2="8" stroke-width="4" stroke-linecap="round"/><polyline points="8,34 18,22 26,28 40,10" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- title block -->
  <text x="260" y="210" font-family="Space Grotesk, sans-serif" font-size="40" font-weight="700" fill="#e7eaf1">Algorithm Visualizer</text>
  <text x="260" y="244" font-family="JetBrains Mono, monospace" font-size="16" fill="#7c8699">Sorting &amp; pathfinding, animated</text>

  <!-- accent bar -->
  <rect x="260" y="264" width="90" height="4" rx="2" fill="#FFB86B"/>

  <!-- corner tag -->
  <rect x="670" y="380" width="110" height="34" rx="6" fill="#10141c" stroke="#FFB86B" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="725" y="402" font-family="JetBrains Mono, monospace" font-size="12" fill="#FFB86B" text-anchor="middle">preview</text>
</svg>
